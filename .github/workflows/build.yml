name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 依赖源自检（失败时方便定位）
        continue-on-error: true
        run: |
          echo "== libxposed api 可用版本 =="
          curl -s https://repo1.maven.org/maven2/io/github/libxposed/api/maven-metadata.xml
          echo
          echo "== libxposed service 可用版本 =="
          curl -s https://repo1.maven.org/maven2/io/github/libxposed/service/maven-metadata.xml

      - name: 准备 Android SDK 平台（android-37）
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" || true
          echo "== 已安装的平台 =="
          sdkmanager --list_installed | grep -E "platforms|build-tools" || true

      - name: 编译 Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: 编译 Release APK（用 debug 签名）
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: imebar-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
